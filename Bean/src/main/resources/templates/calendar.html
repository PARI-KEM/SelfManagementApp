<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8"/>
    <title>Calendar</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .day-cell { transition: transform .12s ease, box-shadow .12s ease; }
        .day-cell:hover { transform: translateY(-4px); box-shadow: 0 10px 20px rgba(0,0,0,0.08); }
        .today-ring { box-shadow: 0 0 0 4px rgba(59,130,246,0.12); }
    </style>
</head>
<body class="bg-gray-50 min-h-screen">

<div class="flex">

    <aside class="w-64 bg-white h-screen p-6 border-r">
        <h2 class="text-2xl font-bold mb-6">Bean</h2>
        <nav class="space-y-3">
            <a href="/dashboard" class="block p-2 rounded bg-gray-100">Dashboard</a>
            <a href="/tasks" class="block p-2">Tasks</a>
            <a href="/notes" class="block p-2">Notes</a>
            <a href="/pomodoro" class="block p-2">Pomodoro</a>
            <a href="/calendar" class="block p-2">Calendar</a>
        </nav>
    </aside>

    <main class="flex-1 p-8">
        <div class="flex justify-between items-center mb-6">
            <div>
                <h1 class="text-4xl font-bold">Calendar</h1>
                <p class="text-sm text-gray-500" th:text="${monthData.suggestion}"></p>
            </div>

            <div class="flex items-center gap-4">
                <form id="navForm" method="get" th:action="@{/calendar}">
                    <input type="hidden" name="month" id="monthInput" th:value="${yearMonth}"/>
                </form>

                <button id="prevBtn" class="px-4 py-2 bg-white rounded shadow">Prev</button>
                <button id="todayBtn" class="px-4 py-2 bg-white rounded shadow">Today</button>
                <button id="nextBtn" class="px-4 py-2 bg-white rounded shadow">Next</button>
            </div>
        </div>

        <div class="grid grid-cols-7 gap-2 text-center text-gray-600 font-medium mb-2">
            <div>Mon</div><div>Tue</div><div>Wed</div><div>Thu</div><div>Fri</div><div>Sat</div><div>Sun</div>
        </div>

        <!-- FIXED GRID -->
        <div class="grid grid-cols-7 gap-3">
            <div th:each="day : ${monthData.days}"
                 th:classappend="${day.inMonth} ? '' : 'opacity-40'"
                 class="day-cell p-3 rounded-lg bg-white border cursor-pointer relative"
                 th:attr="data-date=${day.date}"
                 onclick="openDayModal(this.dataset.date)">

                <div th:if="${day.isHoliday}"
                     th:style="'background:' + ${day.themeColorHex} + ';'"
                     class="absolute -top-3 -right-3 w-8 h-8 rounded-full ring-2 ring-white shadow-lg"></div>

                <div class="flex justify-between items-start mb-2">
                    <div>
                        <div th:classappend="${day.isToday} ? 'today-ring rounded-full p-1' : ''" class="inline-block">
                            <div class="text-sm font-semibold" th:text="${day.date.dayOfMonth}"></div>
                        </div>
                    </div>

                    <div class="text-right text-xs">
                        <div th:if="${day.tasksCount > 0}"
                             class="text-gray-500"
                             th:text="${day.tasksCount + ' tasks'}"></div>

                        <div th:if="${!(day.tasksCount > 0)}" class="text-gray-300">&nbsp;</div>
                    </div>
                </div>

                <div>
                    <div th:if="${day.isHoliday}"
                         class="text-xs font-semibold"
                         th:text="${day.holidayName}"></div>
                </div>

            </div>
        </div>

        <div id="dayModal" class="fixed inset-0 bg-black/30 hidden items-center justify-center z-50">
            <div class="bg-white rounded-lg w-1/3 p-6">
                <div class="flex justify-between items-center mb-4">
                    <h3 id="modalTitle" class="text-xl font-semibold">Day details</h3>
                    <button onclick="closeDayModal()" class="text-gray-500">✕</button>
                </div>

                <div id="modalBody"></div>

                <div class="mt-4 text-right">
                    <button onclick="closeDayModal()" class="px-4 py-2 bg-gray-100 rounded">Close</button>
                </div>
            </div>
        </div>

    </main>
</div>

<script>
    const yearMonth = '[[${yearMonth}]]';
    const ymParts = yearMonth.split('-');

    let currentYear = parseInt(ymParts[0]);
    let currentMonth = parseInt(ymParts[1]);

    document.getElementById('prevBtn').onclick = () => {
        let d = new Date(currentYear, currentMonth - 2);
        document.getElementById('monthInput').value =
            d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0');
        document.getElementById('navForm').submit();
    };

    document.getElementById('nextBtn').onclick = () => {
        let d = new Date(currentYear, currentMonth);
        document.getElementById('monthInput').value =
            d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0');
        document.getElementById('navForm').submit();
    };

    document.getElementById('todayBtn').onclick = () => {
        const t = new Date();
        document.getElementById('monthInput').value =
            t.getFullYear() + '-' + String(t.getMonth() + 1).padStart(2, '0');
        document.getElementById('navForm').submit();
    };

    async function openDayModal(date) {
        document.getElementById('dayModal').classList.remove('hidden');

        const res = await fetch(`/calendar/day?date=${date}`);
        if (!res.ok) {
            document.getElementById('modalBody').innerHTML =
                '<p class="text-sm text-red-500">Failed to load</p>';
            return;
        }

        const data = await res.json();
        const title = `${data.date} ${data.isHoliday ? ' - ' + data.holidayName : ''}`;
        document.getElementById('modalTitle').innerText = title;

        let html = `<p><strong>Tasks:</strong> ${data.tasksCount}</p>`;
        if (data.isHoliday) {
            html += `<p><strong>Holiday:</strong> ${data.holidayName}</p>`;
        }
        html += `<div class="mt-3"><button onclick="createQuickEvent('${data.date}')"
                 class="px-3 py-2 bg-indigo-600 text-white rounded">Quick add event</button></div>`;
        document.getElementById('modalBody').innerHTML = html;
    }

    function closeDayModal() {
        document.getElementById('dayModal').classList.add('hidden');
    }

    function createQuickEvent(date) {
        const title = prompt('Event title for ' + date);
        if (!title) return;
        alert('Saving event "' + title + '" on ' + date + ' (implement backend).');
    }
</script>

</body>
</html>
