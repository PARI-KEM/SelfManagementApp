<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Register • Bean</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
<div class="auth-wrap">
    <div class="auth-card">
        <div class="logo">Bean</div>
        <div class="tagline">your cozy study buddy</div>
        <h2>Create your account 💖</h2>

        <div th:if="${error}" class="error-msg" th:text="${error}"></div>

        <form th:action="@{/auth/register}" method="post" th:object="${registerRequest}">
            <input type="text"     th:field="*{name}"     class="input" placeholder="Your name" required />
            <input type="email"    th:field="*{email}"    class="input" placeholder="Email" required />
            <input type="password" th:field="*{password}" class="input" placeholder="Password" required />
            <button type="submit" class="btn">Sign up</button>
        </form>

        <p class="link-text">
            Already have an account? <a th:href="@{/auth/login}">Sign in</a>
        </p>
    </div>
</div>
</body>
</html>
