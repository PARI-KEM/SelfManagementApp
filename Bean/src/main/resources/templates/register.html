<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Register | Bean App</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css">
</head>

<body class="bg-gray-100 flex justify-center items-center h-screen">

<div class="bg-white p-8 rounded-xl shadow-lg w-96">
    <h2 class="text-2xl font-bold text-center mb-6">Create Account ✨</h2>

    <form action="/register" method="POST" class="space-y-4">

        <!-- Error -->
        <div th:if="${error}" class="text-red-500 text-sm text-center">
            Email already exists!
        </div>

        <div>
            <label class="block mb-1 font-semibold">Name</label>
            <input type="text" name="name" required
                   class="w-full px-3 py-2 border rounded-md focus:ring focus:ring-green-300">
        </div>

        <div>
            <label class="block mb-1 font-semibold">Email</label>
            <input type="email" name="email" required
                   class="w-full px-3 py-2 border rounded-md focus:ring focus:ring-green-300">
        </div>

        <div>
            <label class="block mb-1 font-semibold">Password</label>
            <input type="password" name="password" required
                   class="w-full px-3 py-2 border rounded-md focus:ring focus:ring-green-300">
        </div>

        <button type="submit"
                class="w-full bg-green-600 hover:bg-green-700 text-white py-2 rounded-md">
            Register
        </button>

        <p class="text-center text-sm mt-2">
            Already have an account?
            <a href="/login" class="text-green-600 font-medium">Login</a>
        </p>
    </form>
</div>

</body>
</html>
