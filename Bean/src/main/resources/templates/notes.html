<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>BEAn Notes</title>
    <link rel="stylesheet" href="/css/notes.css">
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f5f5f5;
        }

        .notes-container {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 16px;
            padding: 20px;
        }

        .note-card {
            background-color: #fffacd;
            padding: 10px;
            border-radius: 10px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.2);
            position: relative;
            display: flex;
            flex-direction: column;
        }

        .note-card textarea {
            width: 100%;
            border: none;
            resize: none;
            background: transparent;
            font-size: 14px;
            outline: none;
        }

        .note-card .delete-btn {
            position: absolute;
            top: 5px;
            right: 5px;
            border: none;
            background: transparent;
            font-size: 18px;
            cursor: pointer;
            color: red;
        }

        .note-card.add-new {
            display: flex;
            flex-direction: column;
        }

        .note-card.add-new textarea {
            height: 80px;
            resize: vertical;
        }

        .note-card.add-new button {
            margin-top: 5px;
            cursor: pointer;
            background-color: #ffd966;
            border: none;
            border-radius: 5px;
            padding: 5px;
            font-weight: bold;
        }
    </style>
</head>
<body>

<div class="notes-container">

    <!-- Existing notes -->
    <div th:each="note : ${notes}" class="note-card" th:id="'note-'+${note.id}">
        <form th:action="@{'/notes/update/' + ${note.id}}" method="post">
            <textarea name="content" th:text="${note.content}"
                      onchange="this.form.submit()" placeholder="Write something..."></textarea>
        </form>
        <form th:action="@{'/notes/delete/' + ${note.id}}" method="post">
            <button class="delete-btn" type="submit">×</button>
        </form>
    </div>

    <!-- Add new note -->
    <div class="note-card add-new">
        <form action="/notes/add" method="post">
            <textarea name="content" placeholder="Take a note..."></textarea>
            <button type="submit">Add</button>
        </form>
    </div>

</div>

</body>
</html>
