<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Notes • Bean</title>
    <link rel="stylesheet" href="/css/style.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/Sortable/1.15.0/Sortable.min.js"></script>
</head>
<body>
<div class="app-layout">

    <div th:replace="~{fragments/sidebar :: sidebar('notes')}"></div>

    <div class="main-content">
        <h1 class="page-title">Notes 📝</h1>
        <p class="page-sub">Sticky thoughts, lecture bits, anything you want to remember.</p>

        <div class="notes-grid" id="notes-container">

            <!-- Add new note -->
            <div class="note-card add-new">
                <form action="/notes/add" method="post" style="display:flex;flex-direction:column;height:100%;">
                    <textarea name="content" placeholder="Take a note..."></textarea>
                    <button type="submit" class="btn btn-sm" style="margin-top:8px;">+ Add note</button>
                </form>
            </div>

            <!-- Existing notes -->
            <div th:each="note : ${notes}"
                 class="note-card"
                 th:id="'note-'+${note.id}"
                 th:style="'background-color:' + ${note.color}">

                <form th:action="@{'/notes/update/' + ${note.id}}" method="post" style="display:flex;flex:1;">
                    <textarea name="content" th:text="${note.content}"
                              onchange="this.form.submit()" placeholder="Write something..."></textarea>
                </form>

                <div class="color-picker">
                    <form th:action="@{'/notes/color/' + ${note.id}}" method="post" style="display:inline;">
                        <input type="hidden" name="color" value="#fff8dc">
                        <button class="color-option" style="background:#fff8dc" type="submit"></button>
                    </form>
                    <form th:action="@{'/notes/color/' + ${note.id}}" method="post" style="display:inline;">
                        <input type="hidden" name="color" value="#ffd1dc">
                        <button class="color-option" style="background:#ffd1dc" type="submit"></button>
                    </form>
                    <form th:action="@{'/notes/color/' + ${note.id}}" method="post" style="display:inline;">
                        <input type="hidden" name="color" value="#d1ffd6">
                        <button class="color-option" style="background:#d1ffd6" type="submit"></button>
                    </form>
                    <form th:action="@{'/notes/color/' + ${note.id}}" method="post" style="display:inline;">
                        <input type="hidden" name="color" value="#d1e8ff">
                        <button class="color-option" style="background:#d1e8ff" type="submit"></button>
                    </form>
                </div>

                <div class="note-actions">
                    <form th:action="@{'/notes/pin/' + ${note.id}}" method="post" style="display:inline;">
                        <button class="note-icon-btn" type="submit" title="Pin"
                                th:text="${note.pinned} ? '📌' : '📍'"></button>
                    </form>
                    <form th:action="@{'/notes/delete/' + ${note.id}}" method="post" style="display:inline;">
                        <button class="note-icon-btn" type="submit" title="Delete">🗑️</button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
    new Sortable(document.getElementById('notes-container'), {
        animation: 150,
        ghostClass: 'sortable-ghost'
    });
</script>
</body>
</html>
