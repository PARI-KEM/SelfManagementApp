<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.w3.org/1999/xhtml">
<head>
  <meta charset="UTF-8">
  <title>Login | Bean App</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css">
</head>

<body class="bg-gray-100 flex justify-center items-center h-screen">

<div class="bg-white p-8 rounded-xl shadow-lg w-96">
  <h2 class="text-2xl font-bold text-center mb-6">Welcome Back 👋</h2>

  <form action="/login" method="POST" class="space-y-4">

    <!-- Error -->
    <div th:if="${error}" class="text-red-500 text-sm text-center">
      Invalid email or password!
    </div>

    <!-- Success -->
    <div th:if="${param.success}" class="text-green-600 text-sm text-center">
      Account created! Please login.
    </div>

    <div>
      <label class="block mb-1 font-semibold">Email</label>
      <input type="email" name="email" required
             class="w-full px-3 py-2 border rounded-md focus:ring focus:ring-blue-300">
    </div>

    <div>
      <label class="block mb-1 font-semibold">Password</label>
      <input type="password" name="password" required
             class="w-full px-3 py-2 border rounded-md focus:ring focus:ring-blue-300">
    </div>

    <button type="submit"
            class="w-full bg-blue-600 hover:bg-blue-700 text-white py-2 rounded-md">
      Login
    </button>

    <p class="text-center text-sm mt-2">
      Don’t have an account?
      <a href="/register" class="text-blue-600 font-medium">Register</a>
    </p>
  </form>
</div>

</body>
</html>
