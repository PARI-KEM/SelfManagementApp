<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Login • Bean</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
<div class="auth-wrap">
    <div class="auth-card">
        <div class="logo">Bean</div>
        <div class="tagline">your cozy study buddy</div>
        <h2>Welcome back 🌸</h2>

        <div th:if="${param.error}" class="error-msg">Invalid email or password.</div>
        <div th:if="${param.logout}" class="error-msg" style="background:#d6f5e0;color:#2d8a4f;border-left-color:#7ad29a;">You've been logged out. See you soon!</div>
        <div th:if="${param.registered}" class="error-msg" style="background:#d6f5e0;color:#2d8a4f;border-left-color:#7ad29a;">Account created — please sign in 🌸</div>
        <div th:if="${error}" class="error-msg" th:text="${error}"></div>

        <form th:action="@{/auth/login}" method="post">
            <input type="email" name="email" class="input" placeholder="Email" required />
            <input type="password" name="password" class="input" placeholder="Password" required />
            <button type="submit" class="btn">Sign in</button>
        </form>

        <p class="link-text">
            New here? <a th:href="@{/auth/register}">Create an account</a>
        </p>
    </div>
</div>
</body>
</html>
