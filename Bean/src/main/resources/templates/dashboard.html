<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Dashboard • Bean</title>
    <link rel="stylesheet" href="/css/style.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
</head>
<body>
<div class="app-layout">

    <div th:replace="~{fragments/sidebar :: sidebar('dashboard')}"></div>

    <div class="main-content">

        <div class="dashboard-header">
            <div>
                <h1 class="page-title">Hi there 💖</h1>
                <p class="page-sub">Here's how you're doing today.</p>
            </div>
            <div>
                <a class="btn btn-outline" id="btn-pdf" href="/dashboard/report?range=weekly">
                    📄 Download report
                </a>
            </div>
        </div>

        <!-- TODAY tiles -->
        <div class="grid grid-4" style="margin-bottom:28px;">
            <div class="stat-tile">
                <div class="icon">✅</div>
                <div class="value" th:text="${tasksCompletedToday}">0</div>
                <div class="label">Tasks completed</div>
            </div>
            <div class="stat-tile">
                <div class="icon">🍅</div>
                <div class="value" th:text="${focusMinutesToday}">0</div>
                <div class="label">Focus minutes</div>
            </div>
            <div class="stat-tile">
                <div class="icon">📝</div>
                <div class="value" th:text="${notesToday}">0</div>
                <div class="label">Notes today</div>
            </div>
            <div class="stat-tile">
                <div class="icon">➕</div>
                <div class="value" th:text="${tasksCreatedToday}">0</div>
                <div class="label">Tasks added</div>
            </div>
        </div>

        <!-- Range tabs -->
        <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:18px;">
            <h2 style="margin:0;color:var(--pink-600);">📊 Productivity report</h2>
            <div class="tab-bar">
                <button class="tab-btn active" data-range="daily">Daily</button>
                <button class="tab-btn"        data-range="weekly">Weekly</button>
                <button class="tab-btn"        data-range="monthly">Monthly</button>
            </div>
        </div>

        <div class="grid grid-2">
            <div class="chart-card">
                <div class="card-title">Tasks completed</div>
                <canvas id="chart-tasks"></canvas>
            </div>
            <div class="chart-card">
                <div class="card-title">Focus minutes</div>
                <canvas id="chart-focus"></canvas>
            </div>
            <div class="chart-card">
                <div class="card-title">Notes created</div>
                <canvas id="chart-notes"></canvas>
            </div>
            <div class="chart-card">
                <div class="card-title">Overview</div>
                <canvas id="chart-overview"></canvas>
            </div>
        </div>
    </div>
</div>

<script>
const PINK_400 = '#ff6b9d';
const PINK_300 = '#ff8fb1';
const PINK_200 = '#ffb6c8';
const PINK_500 = '#e75a8a';

Chart.defaults.font.family = 'Quicksand, sans-serif';
Chart.defaults.color = '#8a6a78';

let charts = {};
let currentRange = 'daily';

function makeBar(ctx, label, color) {
    return new Chart(ctx, {
        type: 'bar',
        data: { labels: [], datasets: [{ label, data: [], backgroundColor: color, borderRadius: 8 }] },
        options: {
            responsive: true,
            maintainAspectRatio: false,
            plugins: { legend: { display: false } },
            scales: {
                y: { beginAtZero: true, grid: { color: '#ffe6ef' } },
                x: { grid: { display: false } }
            }
        }
    });
}

function makeLine(ctx, label, color) {
    return new Chart(ctx, {
        type: 'line',
        data: { labels: [], datasets: [{
            label, data: [], borderColor: color, backgroundColor: color + '33',
            fill: true, tension: 0.4, pointBackgroundColor: color, pointRadius: 5
        }]},
        options: {
            responsive: true,
            maintainAspectRatio: false,
            plugins: { legend: { display: false } },
            scales: {
                y: { beginAtZero: true, grid: { color: '#ffe6ef' } },
                x: { grid: { display: false } }
            }
        }
    });
}

function makeMulti(ctx) {
    return new Chart(ctx, {
        type: 'bar',
        data: { labels: [], datasets: [
            { label: 'Tasks',  data: [], backgroundColor: PINK_400, borderRadius: 6 },
            { label: 'Focus (min)', data: [], backgroundColor: PINK_300, borderRadius: 6 },
            { label: 'Notes',  data: [], backgroundColor: PINK_200, borderRadius: 6 }
        ]},
        options: {
            responsive: true,
            maintainAspectRatio: false,
            plugins: { legend: { position: 'bottom' } },
            scales: {
                y: { beginAtZero: true, grid: { color: '#ffe6ef' } },
                x: { grid: { display: false } }
            }
        }
    });
}

function initCharts() {
    charts.tasks    = makeBar (document.getElementById('chart-tasks').getContext('2d'),   'Tasks completed', PINK_400);
    charts.focus    = makeLine(document.getElementById('chart-focus').getContext('2d'),   'Focus minutes',   PINK_500);
    charts.notes    = makeBar (document.getElementById('chart-notes').getContext('2d'),   'Notes',           PINK_300);
    charts.overview = makeMulti(document.getElementById('chart-overview').getContext('2d'));
}

async function loadRange(range) {
    currentRange = range;
    const res = await fetch('/dashboard/api/' + range);
    if (!res.ok) return;
    const data = await res.json();

    charts.tasks.data.labels = data.labels;
    charts.tasks.data.datasets[0].data = data.completedTasks;
    charts.tasks.update();

    charts.focus.data.labels = data.labels;
    charts.focus.data.datasets[0].data = data.focusMinutes;
    charts.focus.update();

    charts.notes.data.labels = data.labels;
    charts.notes.data.datasets[0].data = data.notes;
    charts.notes.update();

    charts.overview.data.labels = data.labels;
    charts.overview.data.datasets[0].data = data.completedTasks;
    charts.overview.data.datasets[1].data = data.focusMinutes;
    charts.overview.data.datasets[2].data = data.notes;
    charts.overview.update();

    // update PDF link
    document.getElementById('btn-pdf').href = '/dashboard/report?range=' + range;
}

document.querySelectorAll('.tab-btn').forEach(btn => {
    btn.addEventListener('click', () => {
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        loadRange(btn.dataset.range);
    });
});

initCharts();
loadRange('daily');
</script>
</body>
</html>
