<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Add Task</title>
    <style>
        body { font-family: Arial; padding: 20px; background: #f4f4f4; }
        .card {
            background: white; padding: 20px; width: 400px; margin: auto;
            border-radius: 10px; box-shadow: 0px 0px 10px #ccc;
        }
        input, select, textarea {
            width: 100%; margin-top: 8px; margin-bottom: 12px;
            padding: 10px; border: 1px solid #bbb; border-radius: 6px;
        }
        button {
            background: #2E89FF; color: white; padding: 12px;
            border: none; width: 100%; border-radius: 8px; cursor: pointer;
        }
        button:hover { background: #1f6bd6; }
    </style>
</head>
<body>

<div class="card">
    <h2>Add Task</h2>

    <form th:action="@{/task/save}" th:object="${task}" method="post">

        <label>Title</label>
        <input type="text" th:field="*{title}" required>

        <label>Description</label>
        <textarea th:field="*{description}" rows="3"></textarea>

        <label>Deadline</label>
        <!-- Keep as String in DTO -->
        <input type="datetime-local" th:field="*{dueDate}" required>

        <label>Priority</label>
        <select th:field="*{priority}">
            <option value="HIGH">HIGH</option>
            <option value="MEDIUM" selected>MEDIUM</option>
            <option value="LOW">LOW</option>
        </select>

        <button type="submit">Save Task</button>

    </form>
</div>

</body>
</html>
