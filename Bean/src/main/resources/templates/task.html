<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Tasks • Bean</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
<div class="app-layout">

    <div th:replace="~{fragments/sidebar :: sidebar('tasks')}"></div>

    <div class="main-content">

        <div style="display:flex;align-items:baseline;justify-content:space-between;flex-wrap:wrap;gap:12px;margin-bottom:8px;">
            <div>
                <h1 class="page-title">Tasks ✅</h1>
                <p class="page-sub">What's on your plate today?</p>
            </div>
            <a href="/task/add" class="btn">+ Add task</a>
        </div>

        <div class="card" style="margin-bottom:20px;">
            <form class="grid grid-4" method="get" th:action="@{/task/search}" style="align-items:end;">
                <div>
                    <label>Keyword</label>
                    <input type="text" class="input" name="keyword" placeholder="search title..."/>
                </div>
                <div>
                    <label>Priority</label>
                    <select class="select" name="priority">
                        <option value="">All</option>
                        <option value="LOW">Low</option>
                        <option value="MEDIUM">Medium</option>
                        <option value="HIGH">High</option>
                    </select>
                </div>
                <div>
                    <label>Status</label>
                    <select class="select" name="status">
                        <option value="">All</option>
                        <option value="TODO">Todo</option>
                        <option value="COMPLETED">Completed</option>
                    </select>
                </div>
                <div>
                    <button type="submit" class="btn">Search</button>
                </div>
            </form>
        </div>

        <table class="task-table">
            <thead>
            <tr>
                <th>Title</th>
                <th>Description</th>
                <th>Priority</th>
                <th>Status</th>
                <th style="text-align:right;">Action</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="task : ${tasks}">
                <td style="font-weight:600;color:var(--text);" th:text="${task.title}">Task</td>
                <td style="color:var(--text-soft);" th:text="${task.description}">desc</td>
                <td>
                    <span class="badge"
                          th:classappend="${task.priority?.name() == 'HIGH'} ? 'badge-high'
                                          : (${task.priority?.name() == 'MEDIUM'} ? 'badge-medium' : 'badge-low')"
                          th:text="${task.priority}">MEDIUM</span>
                </td>
                <td>
                    <span class="badge" th:classappend="${task.completed} ? 'badge-done' : 'badge-todo'"
                          th:text="${task.completed} ? 'Done' : 'Todo'">Todo</span>
                </td>
                <td style="text-align:right;">
                    <a th:href="@{/task/{id}/toggle(id=${task.id})}"
                       th:text="${task.completed} ? 'Mark todo' : 'Mark done'"
                       class="btn btn-sm"
                       th:classappend="${task.completed} ? 'btn-outline' : ''"></a>
                </td>
            </tr>
            <tr th:if="${#lists.isEmpty(tasks)}">
                <td colspan="5" style="text-align:center;padding:30px;color:var(--text-soft);">
                    No tasks yet — add your first one ✨
                </td>
            </tr>
            </tbody>
        </table>
    </div>
</div>
</body>
</html>
